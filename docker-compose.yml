name: saaswatch

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    container_name: saaswatch-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=${ES_JAVA_OPTS}
    volumes:
      - ./config/elasticsearch/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
    mem_limit: 1200m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://localhost:9200/_cluster/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - saaswatch-network

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_VERSION}
    container_name: saaswatch-logstash
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
    volumes:
      - ./config/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./config/logstash/pipeline:/usr/share/logstash/pipeline:ro
    ports:
      - "127.0.0.1:9600:9600"
      - "127.0.0.1:8080:8080"
    mem_limit: 800m
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - saaswatch-network

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_VERSION}
    container_name: saaswatch-kibana
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      XPACK_SECURITY_ENABLED: "false"
      NODE_OPTIONS: "--max-old-space-size=512"
    ports:
      - "127.0.0.1:5601:5601"
    mem_limit: 900m
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
    - saaswatch-network

  mongodb:
    image: mongo:7.0
    container_name: saaswatch-mongodb
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongodb_data:/data/db
    mem_limit: 512m
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - saaswatch-network

  redis:
    image: redis:7-alpine
    container_name: saaswatch-redis
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - saaswatch-network

  flask:
    build:
      context: .
      dockerfile: Dockerfile
    image: saaswatch-api:1.0.0
    container_name: saaswatch-flask
    restart: unless-stopped
    environment:
      FLASK_ENV: development
      ELASTICSEARCH_URL: http://elasticsearch:9200
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: saaswatch
      REDIS_URL: redis://redis:6379/0
      LOGSTASH_URL: http://logstash:8080
    ports:
      - "127.0.0.1:5000:5000"
    mem_limit: 256m
    depends_on:
      elasticsearch:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - saaswatch-network


volumes:
  elasticsearch_data:
  mongodb_data:
networks:
  saaswatch-network:
    driver: bridge
