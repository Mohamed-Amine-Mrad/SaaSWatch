
input {
  http {
    port => 8080
    codec => json
  }
}

filter {
  mutate {
    add_field => {
      "service" => "saaswatch"
      "environment" => "development"
      "event_type" => "connectivity_test"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "saaswatch-connectivity-test"
  }

  stdout {
    codec => rubydebug
  }
}

